<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Dashboard</title>
<script>
  // Clean URLs on GitHub Pages: every section address (lssouthreno.com/sunday, /staff …)
  // lands here; hand it to the dashboard, which restores the address and opens that page.
  // This page is also padded past 512 bytes so every browser shows it instead of its own
  // "not found" screen. ------------------------------------------------------------------
  // Short links into the Living Stones app (the member app at /journey/): lssouthreno.com/give etc.
  var APP = { '/app': '', '/give': 'give', '/events': 'events', '/connect': 'connect', '/me': 'me', '/prayer': 'me/prayer', '/next': '' };
  var path = location.pathname.replace(/\/+$/, '').toLowerCase();
  if (Object.prototype.hasOwnProperty.call(APP, path)) location.replace('/journey/' + location.search + (APP[path] ? '#' + APP[path] : ''));
  else location.replace('/?r=' + encodeURIComponent(location.pathname + location.search) + location.hash);
</script>
<meta name="robots" content="noindex">
</head>
<body style="background:#141414;color:#a39e94;font-family:sans-serif;padding:40px">Loading the dashboard…</body>
</html>
