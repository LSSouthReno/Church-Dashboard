name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Newer pushes queued while a deploy is
# in progress supersede each other (only the latest waits), but we do NOT
# cancel an in-progress deploy — cancelling mid-publish leaves GitHub's Pages
# backend finalizing and makes the next deploy fail with "try again later".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # The frequent data-sync pushes land within a few seconds of each other. When
      # they cluster, GitHub Pages rejects a new deploy with a 400 "due to in progress
      # deployment" — either a prior deploy is still finalizing, or a superseded run
      # left a deployment stuck "in progress" (a zombie). deploy-pages@v4 does NOT
      # wait/retry on this 400 — it fails immediately. The blocking deployment always
      # clears on its own, but that can take several minutes (we've observed a run
      # self-heal only after ~10 min of waiting). So we retry with cumulative backoff
      # that covers the full self-heal window (~13 min) instead of giving up early.
      # The site is never broken by the conflict — each retry just re-publishes the
      # same artifact once GitHub is ready, so the run finishes green (no failure email).
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before attempt 4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: sleep 180
      - name: Deploy to GitHub Pages (attempt 4)
        id: deploy4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.deploy4.outcome == 'failure'
        run: sleep 300

      # Final attempt (~13 min of cumulative backoff elapsed) has no continue-on-error:
      # if it STILL fails, the blocker is not clearing and that's a real problem worth
      # an email notification.
      - name: Deploy to GitHub Pages (attempt 5)
        id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.deploy4.outcome == 'failure'
        uses: actions/deploy-pages@v4
