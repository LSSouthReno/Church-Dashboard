name: Deploy to GitHub Pages

# Publishing strategy (rev. 2026-08-06):
# The GAS sync pushes a data commit to main every few minutes. Deploying Pages on
# *every* commit made the deploys pile up on one concurrency group and jam — on
# 2026-07-29 a run got stuck in "waiting" for 8 days, deadlocking the group so
# nothing published (site frozen at Jul 29). Fix: DON'T deploy per data-commit.
# Deploy on a ~15-min schedule (picks up whatever's in main), plus a manual button,
# plus a self-trigger whenever this workflow file itself changes. The concurrency
# group was renamed (pages -> pages-publish) so new runs never wait behind the old
# jammed group. 15-min freshness comfortably satisfies the "refreshes hourly" promise.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-progress publish (cancelling mid-
# publish leaves GitHub's Pages backend finalizing and makes the next deploy fail).
# Group renamed off the old "pages" group that a zombie run had deadlocked.
concurrency:
  group: pages-publish-2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # deploy-pages@v4 fails immediately on a 400 "deployment in progress" (a prior
      # deploy still finalizing, or a superseded run left a zombie deployment). The
      # blocker always clears on its own, but that can take several minutes. Retry with
      # cumulative backoff (~13 min) instead of giving up early. Each retry just
      # re-publishes the same artifact once GitHub is ready, so the run finishes green.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before attempt 4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: sleep 180
      - name: Deploy to GitHub Pages (attempt 4)
        id: deploy4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.deploy4.outcome == 'failure'
        run: sleep 300

      # Final attempt (~13 min cumulative backoff): no continue-on-error, so if it
      # STILL fails that's a real problem worth an email notification.
      - name: Deploy to GitHub Pages (attempt 5)
        id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.deploy4.outcome == 'failure'
        uses: actions/deploy-pages@v4

# Deploy pipeline last reviewed 2026-08-06.
