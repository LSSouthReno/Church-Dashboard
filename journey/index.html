<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f3ee">
<title>Living Stones</title>
<!-- The member app: installing from this page gives "Living Stones" (opens on /journey/; scope "/" so
     the Dashboard link stays inside the app for staff). The staff app is /manifest.webmanifest. See APP-PLAN.md. -->
<link rel="manifest" href="/journey/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Living Stones">
<link rel="icon" type="image/png" href="/assets/app/icon-192.png">
<link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<!--
  My Journey — every person's private page (linked from the dashboard nav). Backend: Code_journey.gs
  (jr_* actions on the Staff OS web app). Sign-in: phone number → texted code (Twilio Verify) or an
  emailed one-tap link + code. Pastors can preview anyone from the Care drawer.
  Leaders (community-group leaders, serve-team leaders) also see their group's / team's roster.
-->
<style>
  :root { --bg:#141414; --card:#1f1f1f; --card-2:#262626; --line:#2e2e2e; --line-2:#3a3a3a; --text:#f2efe9; --muted:#a39e94; --dim:#78726a;
    --gold:#d4af37; --gold-hi:#e3c35a; --gold-bg:rgba(212,175,55,.12); --gold-line:rgba(212,175,55,.38); --ok:#8fd1a8; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--gold); }
  .top { height:60px; display:flex; align-items:center; gap:12px; padding:0 24px; border-bottom:1px solid var(--line); background:rgba(20,20,20,.96); position:sticky; top:0; z-index:5; }
  .top img { height:28px; }
  .top .t { border-left:1px solid var(--line-2); padding-left:12px; font-weight:700; color:var(--muted); font-size:14px; }
  .top .r { margin-left:auto; display:flex; gap:8px; align-items:center; }
  /* Embedded inside the dashboard's My Journey tab (?embed=1): no top bar, tighter page padding. */
  body.embed .top { display:none; }
  body.embed .wrap { padding:10px 0 30px; max-width:none; }
  body.embed .signin { padding-top:10px; }
  body.embed .quiet { margin-bottom:0; }
  .roster { width:100%; border-collapse:collapse; font-size:13.5px; }
  .roster th { text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700; padding:0 6px 8px; }
  .roster td { padding:9px 6px; border-top:1px solid var(--line); vertical-align:top; line-height:1.35; }
  .roster td.n { font-weight:600; white-space:nowrap; }
  .roster td.n small { display:block; color:var(--dim); font-weight:500; font-size:11.5px; }
  .roster .y { color:var(--ok); font-weight:700; } .roster .nn { color:var(--dim); } .roster .q { color:var(--dim); }
  .roster td.s { color:var(--muted); font-size:12.5px; }
  .lead-sum { display:flex; gap:14px; flex-wrap:wrap; margin:0 0 12px; color:var(--muted); font-size:13px; }
  .lead-sum b { color:var(--text); }
  @media (max-width:640px) {
    .roster thead { display:none; }
    .roster tr { display:block; padding:10px 0; border-top:1px solid var(--line); }
    .roster td { display:block; border:0; padding:2px 0; }
    .roster td.f::before, .roster td.o::before { content:attr(data-l) ': '; color:var(--dim); font-size:12px; }
    .roster td.f, .roster td.o { display:inline-block; margin-right:14px; }
    .roster td.s { padding-top:4px; }
  }
  .wrap { max-width:1180px; margin:0 auto; padding:30px 24px 60px; }
  .btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; font:700 14px 'Montserrat',sans-serif; padding:10px 16px; border-radius:9px; border:1px solid var(--line-2); background:var(--card-2); color:var(--text); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .btn:hover { border-color:#4a4a4a; }
  .btn.p { background:var(--gold); border-color:var(--gold); color:#1a1407; }
  .btn.p:hover { background:var(--gold-hi); }
  .btn.g { background:none; color:var(--muted); }
  .btn.sm { padding:7px 12px; font-size:13px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .banner .why { margin-top:5px; color:var(--muted); font-weight:500; font-size:13px; } .banner .why b { color:var(--gold); }
  .banner { background:var(--gold-bg); border-bottom:1px solid var(--gold-line); color:var(--gold); font-size:13.5px; font-weight:600; padding:10px 24px; text-align:center; }
  /* sign-in */
  .signin { max-width:420px; margin:0 auto; padding:56px 22px 60px; text-align:center; }
  .signin img.mark { width:58px; height:58px; }
  .signin h1 { font-family:'Montserrat',sans-serif; font-weight:700; letter-spacing:-.01em; font-size:30px; margin:18px 0 10px; }
  .signin p { color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 22px; }
  .field { width:100%; background:var(--card-2); border:1px solid var(--line-2); border-radius:11px; padding:15px 16px; font:500 18px 'Montserrat',sans-serif; color:var(--text); text-align:center; letter-spacing:.02em; }
  .field:focus { outline:none; border-color:var(--gold-line); }
  .field.code { font-size:28px; letter-spacing:.35em; font-weight:800; }
  .signin .btn { width:100%; padding:14px; font-size:15px; margin-top:12px; }
  .or { display:flex; align-items:center; gap:12px; color:var(--dim); font-size:12.5px; margin:20px 0 8px; }
  .or::before, .or::after { content:''; flex:1; height:1px; background:var(--line); }
  .fine { color:var(--dim); font-size:13px; line-height:1.6; margin-top:18px; }
  .err { color:#f0a3a4; font-size:14px; margin-top:12px; min-height:20px; }
  .pick { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  /* journey */
  .hero { display:flex; gap:18px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
  .hero .av { width:64px; height:64px; border-radius:50%; object-fit:cover; background:var(--card-2); flex-shrink:0; border:2px solid var(--gold-line); }
  .hero h1 { margin:0; font-family:'Playfair Display',serif; font-size:32px; line-height:1.15; }
  .hero .s { color:var(--muted); font-size:15px; margin-top:6px; line-height:1.55; max-width:680px; }
  .path { display:flex; margin:6px 0 28px; }
  .stop { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; text-align:center; padding:0 4px; }
  .stop .dot { width:18px; height:18px; border-radius:50%; border:2px solid #4a4843; background:var(--bg); z-index:1; }
  .stop.done .dot { background:var(--gold); border-color:var(--gold); }
  .stop.now .dot { border-color:var(--gold); box-shadow:0 0 0 5px rgba(212,175,55,.18); }
  .stop b { font-size:14px; } .stop.now b { color:var(--gold); }
  .stop span { font-size:12.5px; color:var(--dim); line-height:1.4; max-width:170px; }
  .stop:not(:last-child)::after { content:''; position:absolute; top:8px; left:50%; width:100%; height:2px; background:#3a3a3a; }
  .stop.done:not(:last-child)::after { background:var(--gold); }
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns:1.35fr 1fr; } .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; min-width:0; }
  .card-h { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .card-h h3 { margin:0; font-size:12.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  .card-h .c { margin-left:auto; font-size:12.5px; color:var(--dim); }
  .step { display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--line); }
  .step:first-of-type { border-top:0; padding-top:4px; }
  .step .ic { width:42px; height:42px; border-radius:12px; background:var(--gold-bg); border:1px solid var(--gold-line); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .step .ic svg { width:21px; height:21px; stroke:var(--gold); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .step b { display:block; font-size:16.5px; margin-bottom:4px; }
  .step p { margin:0 0 12px; color:var(--muted); font-size:14.5px; line-height:1.6; }
  .step .acts { display:flex; gap:8px; flex-wrap:wrap; }
  .step.celebrate .ic { background:rgba(95,174,126,.12); border-color:rgba(95,174,126,.4); } .step.celebrate .ic svg { stroke:var(--ok); }
  .fact { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); font-size:15px; }
  .fact:first-of-type { border-top:0; padding-top:2px; }
  .fact .k { width:94px; flex-shrink:0; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); padding-top:3px; }
  .fact .v { flex:1; line-height:1.5; min-width:0; }
  .fact .v small { display:block; color:var(--dim); font-size:13px; margin-top:2px; }
  .ok { color:var(--ok); }
  .ms { position:relative; padding-left:22px; }
  .ms::before { content:''; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:#3a3a3a; }
  .ms div { position:relative; padding:7px 0; font-size:14.5px; line-height:1.4; }
  .ms div::before { content:''; position:absolute; left:-20px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
  .ms div.next { color:var(--dim); } .ms div.next::before { background:var(--bg); border:2px solid #4a4843; width:6px; height:6px; }
  .ms span { color:var(--dim); font-size:12.5px; margin-left:6px; white-space:nowrap; }
  .pastor { display:flex; gap:14px; align-items:center; }
  .pastor .av { width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#6b5a3a,#3a3226); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex-shrink:0; }
  .muted { color:var(--muted); } .dim { color:var(--dim); font-size:13px; }
  .quiet { font-size:13px; color:var(--dim); line-height:1.6; margin-top:22px; border-top:1px solid var(--line); padding-top:16px; }
  .loading { text-align:center; color:var(--muted); padding:90px 20px; font-size:15px; }
  /* note sheet */
  .sheet-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet-ov.open { display:flex; }
  .sheet { background:var(--card); border:1px solid var(--line-2); border-radius:18px 18px 0 0; width:min(560px,100%); padding:22px 22px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin:0 0 6px; font-size:18px; }
  .sheet textarea { width:100%; min-height:130px; background:var(--card-2); border:1px solid var(--line-2); border-radius:10px; padding:12px 14px; font:15px/1.5 'Montserrat',sans-serif; color:var(--text); resize:vertical; margin-top:10px; }
  .sheet textarea:focus { outline:none; border-color:var(--gold-line); }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1f1f1f; border:1px solid var(--gold-line); color:var(--text); padding:11px 18px; border-radius:10px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:30; max-width:calc(100% - 32px); }
  .toast.show { opacity:1; }
  @media (max-width: 900px) { .g2, .g3 { grid-template-columns:1fr; } }
  /* one grid: desktop = balanced columns, phone = app order (For you → News → Coming up → …) */
  .jg { display:grid; gap:16px; grid-template-columns:repeat(12,minmax(0,1fr)); align-items:start; }
  .jg > .a-foryou { grid-column:span 7; } .jg > .a-year { grid-column:span 5; } .jg > .a-news { grid-column:1/-1; }
  .jg > .a-coming, .jg > .a-pastor, .jg > .a-ms { grid-column:span 4; }
  .hero h1 { font-family:'Montserrat',sans-serif; font-weight:700; letter-spacing:-.01em; }
  .hero .av.ini { display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:var(--gold); background:var(--gold-bg); }
  @media (max-width: 900px) {
    .jg > * { grid-column:1/-1 !important; }
    .jg > .a-foryou { order:1; } .jg > .a-news { order:2; } .jg > .a-coming { order:3; } .jg > .a-year { order:4; } .jg > .a-pastor { order:5; } .jg > .a-ms { order:6; }
  }
  @media (max-width: 640px) {
    .wrap { padding:22px 16px 60px; } .top { padding:0 16px; } .top .t { display:none; }
    .hero h1 { font-size:26px; } .path { overflow-x:auto; padding-bottom:6px; } .stop { min-width:96px; } .stop span { display:none; }
    .card { padding:18px 16px; } .fact .k { width:78px; }
  }
  /* pathway badges · "persistent encouragement" (same icons as the dashboard + lobby poster) */
  .badges { display:flex; gap:10px; flex-wrap:wrap; margin:-8px 0 22px; }
  .badge { appearance:none; display:flex; flex-direction:column; align-items:center; gap:5px; width:74px; background:none; border:0; padding:0; cursor:pointer; font:700 11px 'Montserrat',sans-serif; color:var(--dim); }
  .badge i { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--line-2); background:var(--card); transition:transform .15s; }
  .badge svg { width:22px; height:22px; fill:none; stroke:#6a655d; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .badge.on { color:var(--text); } .badge.on i { background:var(--gold); border-color:var(--gold); } .badge.on svg { stroke:#1a1407; }
  .badge:hover i { transform:translateY(-2px); }
  @media (max-width:520px) {
    .badges { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:4px; }
    .badge { width:auto; font-size:10px; } .badge i { width:40px; height:40px; } .badge svg { width:19px; height:19px; }
  }
  @media (max-width:420px) { .top { gap:8px; } .top img { height:24px; } .top .btn.sm { padding:6px 9px; font-size:12px; } }
  .seeyou { display:flex; gap:8px; flex-wrap:wrap; margin:-12px 0 22px; }
  .seeyou span { background:var(--gold-bg); border:1px solid var(--gold-line); color:var(--text); border-radius:99px; padding:7px 13px; font-size:13.5px; line-height:1.3; }
  .step.flash { animation:flash 1.6s ease; } @keyframes flash { 0%,60% { background:var(--gold-bg); } 100% { background:none; } }
  .news { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .nv { display:flex; flex-direction:column; background:var(--card-2); border:1px solid var(--line); border-radius:12px; overflow:hidden; color:var(--text); text-decoration:none; min-width:0; }
  .nv:hover { border-color:var(--line-2); }
  .nv img { width:100%; aspect-ratio:16/9; object-fit:cover; background:#191919; display:block; }
  .nv div { padding:11px 13px 13px; display:flex; flex-direction:column; gap:4px; }
  .nv small { color:var(--muted); font-size:12.5px; } .nv b { font-size:15px; line-height:1.3; }
  .nv em { align-self:flex-start; font-style:normal; font-size:11px; font-weight:800; letter-spacing:.04em; color:#1a1407; background:var(--gold); border-radius:99px; padding:2px 8px; margin-bottom:2px; }
  /* ── the app shell: tabs (top bar on wide screens, bottom bar on phones) ── */
  .ttabs { display:flex; gap:2px; margin-left:16px; }
  .ttabs button, .seg button { appearance:none; background:none; border:0; display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border-radius:9px; font:600 14px 'Montserrat',sans-serif; color:var(--muted); cursor:pointer; }
  .ttabs button svg, .tabbar button svg, .seg button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .ttabs button:hover, .seg button:hover { color:var(--text); }
  .ttabs button.on, .seg button.on { color:var(--gold); background:var(--gold-bg); }
  .tabbar { display:none; }
  .seg { display:flex; gap:4px; overflow-x:auto; margin:0 0 16px; padding-bottom:2px; scrollbar-width:none; } .seg::-webkit-scrollbar { display:none; } .seg button { flex:none; }
  .ph h2 { margin:0 0 4px; font-size:26px; font-weight:700; letter-spacing:-.01em; } .ph p { margin:0 0 18px; font-size:14.5px; }
  .jg > .a-side { grid-column:span 5; display:grid; gap:16px; align-content:start; }
  .jg > .a-half { grid-column:span 6; }
  .card-h a.c { color:var(--gold); text-decoration:none; font-weight:700; }
  .sun-d { font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .sun-t { font-size:18px; font-weight:700; margin:6px 0 2px; line-height:1.3; }
  .sun-times { margin-top:10px; font-weight:700; font-size:15px; }
  .sun-x { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .sun-x span { font-size:12px; font-weight:700; background:var(--gold-bg); color:var(--gold); border-radius:99px; padding:4px 9px; }
  /* events */
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chips button { appearance:none; border:1px solid var(--line-2); background:var(--card); color:var(--muted); border-radius:99px; padding:8px 14px; font:600 13px 'Montserrat',sans-serif; cursor:pointer; min-height:38px; }
  .chips button.on { background:var(--gold-bg); color:var(--gold); border-color:var(--gold-line); }
  .evl { display:grid; gap:8px; max-width:820px; }
  .evh { margin:14px 0 4px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .evr { appearance:none; display:grid; grid-template-columns:64px 1fr 20px; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; color:var(--text); font-family:inherit; }
  .evr:hover { border-color:var(--line-2); }
  .evr img, .evr .evd { width:64px; height:48px; border-radius:8px; object-fit:cover; background:var(--card-2); }
  .evd { display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--muted); font-weight:700; } .evd b { font-size:18px; color:var(--text); line-height:1; }
  .evt { min-width:0; } .evt b { display:block; font-size:15px; line-height:1.3; } .evt small { color:var(--muted); font-size:12.5px; }
  .evt em { font-style:normal; font-size:10.5px; font-weight:800; color:#1a1407; background:var(--gold); border-radius:99px; padding:1px 7px; margin-bottom:3px; display:inline-block; }
  .chv { width:18px; height:18px; fill:none; stroke:var(--dim); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .sheet { max-height:90vh; overflow:auto; }
  .sh-img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px; margin-bottom:12px; display:block; }
  .sh-desc { color:var(--muted); font-size:14.5px; line-height:1.6; white-space:pre-line; max-height:32vh; overflow:auto; }
  .sh-acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  /* connect · give · me */
  .pill { font-size:11px; font-weight:800; color:var(--gold); background:var(--gold-bg); border-radius:99px; padding:2px 8px; margin-left:6px; white-space:nowrap; }
  .acts2 { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .sub-h { margin:14px 0 2px; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .search { width:100%; background:var(--card-2); border:1px solid var(--line-2); border-radius:10px; padding:11px 13px; font:500 15px 'Montserrat',sans-serif; color:var(--text); margin-bottom:8px; }
  .search:focus { outline:none; border-color:var(--gold-line); }
  .flist { display:grid; max-height:440px; overflow:auto; }
  .frow { display:block; padding:11px 4px; border-top:1px solid var(--line); text-decoration:none; color:var(--text); } .frow:first-child { border-top:0; }
  .frow b { display:block; font-size:14.5px; } .frow small { color:var(--muted); font-size:12.5px; } .frow:hover b { color:var(--gold); }
  .give-hero .gtxt { font-size:16px; line-height:1.6; margin:0 0 16px; }
  .give-acts { display:grid; gap:10px; } .btn.big { padding:14px 18px; font-size:16px; border-radius:12px; }
  .ll { display:grid; }
  .lrow { display:flex; align-items:center; gap:12px; padding:12px 2px; border-top:1px solid var(--line); text-decoration:none; color:var(--text); min-height:54px; }
  .ll .lrow:first-child { border-top:0; }

    /* the app on a phone: bottom tab bar, like any app */

    .tabbar button svg { width:23px; height:23px; } .tabbar button.on { color:var(--gold); }
    body.app-in:not(.embed) .wrap { padding-bottom:calc(100px + env(safe-area-inset-bottom)); }
    .ttabs, .wide-only { display:none !important; }

    .evr { grid-template-columns:56px 1fr 18px; } .evr img, .evr .evd { width:56px; height:44px; }
    .sh-acts .btn { flex:1 1 45%; min-height:46px; }

    .t-home .hero h1 { font-size:24px; } .t-home .hero .s { font-size:13.5px; line-height:1.5; }

  }
  /* "Get the app" card (phones that haven't installed it yet) */
  .getapp { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--gold-line); border-radius:14px; padding:14px 16px; margin:0 0 18px; }
  .getapp img { width:52px; height:52px; border-radius:12px; flex:none; }
  .getapp b { display:block; font-size:15px; margin-bottom:2px; }
  .getapp p { margin:0; color:var(--muted); font-size:13.5px; line-height:1.45; }

  html[data-theme="soft"] .btn.p, html[data-theme="soft"] .nv em { color:#fff; }   /* white on the soft bronze (dark ink was 3.6:1) */
  html[data-theme="soft"] .top { background:rgba(255,255,255,.9); backdrop-filter:saturate(1.2) blur(12px); -webkit-backdrop-filter:saturate(1.2) blur(12px); }

<body>
<div class="top"><img src="/assets/ls-lockup-white.png" alt="Living Stones South Reno"><nav class="ttabs" id="ttabs" aria-label="App sections"></nav><div class="r" id="topR"></div></div>
<div id="banner"></div>
<div id="app"><div class="loading">Loading…</div></div>
<div class="sheet-ov" id="sheetOv" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<nav class="tabbar" id="tabbar" aria-label="App sections"></nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx-YDZg924fyFkG2U69o6Z0BBTLsh8ZAUvwK4fxSkW7LKGiXlxn5s2jyq9GCDxwA_sANA/exec';
const TOKEN_KEY = 'lssr_journey_token';
const DISMISS_KEY = 'lssr_journey_dismiss';
const S = { cfg: null, data: null, phone: '', ticket: '', preview: '', pw: '' };

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function tokenGet() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function tokenSet(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), 2800); }
// Requests go as GET (…/exec?action=jr&p=<json>): Google answers every call with a redirect,
// and when a browser is signed into Google a POST body can be dropped on the way — the server
// then sees an empty request and returns a generic {ok:true}. Every reply names the action it
// answers (`for`); anything else is treated as a failed try. Long notes still go by POST.
async function api(body, tries) {
  const n = tries || 3, q = JSON.stringify(body);
  for (let i = 0; i < n; i++) {
    try {
      const usePost = body.action === 'jr_note' && q.length > 1500 && i === 0;
      const r = usePost ? await fetch(API, { method: 'POST', body: q })
                        : await fetch(API + '?action=jr&p=' + encodeURIComponent(q) + '&t=' + Date.now());
      const j = await r.json();
      if (j && j.for === body.action) return j;
      throw new Error('stray reply');
    } catch (e) {
      if (i + 1 >= n) return { ok: false, error: 'We couldn’t reach the server — please check your connection and try again.' };
      await new Promise(r => setTimeout(r, 1000 + i * 1500));
    }
  }
}
// First call after a quiet spell can take a while (the server is waking up) — say so.
function slowNote(el, msg) { return setTimeout(() => { const a = document.querySelector(el); if (a && /Loading|Gathering|Getting everything/.test(a.innerText)) a.innerHTML = '<div class="loading">' + msg + '</div>'; }, 6000); }
function fmtDate(iso, opts) { if (!iso) return ''; const d = new Date(String(iso).length === 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? '' : d.toLocaleDateString('en-US', opts || { month: 'short', year: 'numeric' }); }
function fmtPhone(v) { const d = v.replace(/\D/g, '').slice(0, 10); if (d.length < 4) return d; if (d.length < 7) return '(' + d.slice(0, 3) + ') ' + d.slice(3); return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6); }

// ── sign-in screens ──────────────────────────────────────────────────────────
function viewSignin(msg) {
  noTabs();
  $('topR').innerHTML = EMBED ? '' : '<a class="btn g sm" href="/">Dashboard</a>'; $('banner').innerHTML = '';
  if (!S.cfg) { $('app').innerHTML = '<div class="loading">Loading…</div>'; api({ action: 'jr_config' }).then(c => { S.cfg = c || {}; viewSignin(msg); }); return; }
  const c = S.cfg || {};
  // No passwords: they type their phone number; the code comes by text (if texting is set up)
  // or to the email on their Living Stones profile (a one-tap link + a code).
  $('app').innerHTML = '<div class="signin"><img class="mark" src="/assets/ls-logo-white.png" alt="">' +
    '<h1>Living Stones</h1><p>Your next step, your groups and teams, events, and giving, all in one place. Sign in with your phone number. No password.</p>' +
    '<input class="field" id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="Your mobile number" oninput="this.value=fmtPhone(this.value)" onkeydown="if(event.key===\'Enter\')sendCode()">' +
    '<button class="btn p" id="sendBtn" onclick="sendCode()">' + (c.channel === 'sms' ? 'Text me a code' : 'Send me a sign-in link') + '</button>' +
    '<div class="err" id="err">' + esc(msg || '') + '</div>' +
    '<div class="fine">Use the number you’ve given Living Stones. ' + (c.channel === 'sms' ? 'We’ll text you a code.' : 'We’ll email a one-tap sign-in link to the address we have for you.') +
    '<br><br><b style="color:var(--muted)">It’s private.</b> Only you, and the pastors who care for you, can see your information.</div></div>';
  const ph = $('ph'); if (ph) setTimeout(() => ph.focus(), 50);
}
async function sendCode() {
  const v = ($('ph') || {}).value || '', d = v.replace(/\D/g, '');
  if (d.length !== 10) { $('err').textContent = 'Please enter your 10-digit mobile number.'; return; }
  const b = $('sendBtn'); b.disabled = true; b.textContent = 'Sending…';
  const r = await api({ action: 'jr_phone_start', phone: d });
  if (!r.ok) { b.disabled = false; b.textContent = (S.cfg || {}).channel === 'sms' ? 'Text me a code' : 'Send me a sign-in link'; $('err').textContent = r.error || 'Please try again.'; return; }
  S.phone = d; S.channel = r.channel || (S.cfg || {}).channel; viewCode();
}
function viewCode(msg) {
  noTabs();
  const d = S.phone;
  $('app').innerHTML = '<div class="signin"><img class="mark" src="/assets/ls-logo-white.png" alt="">' +
    (S.channel === 'sms'
      ? '<h1 style="font-size:26px">Check your texts</h1><p>If ' + esc(fmtPhone(d)) + ' is the number Living Stones has for you, a 6-digit code is on its way.</p>'
      : '<h1 style="font-size:26px">Check your email</h1><p>If ' + esc(fmtPhone(d)) + ' is the number Living Stones has for you, we just emailed you a sign-in link. ' + (appStandalone() ? '<b style="color:var(--text)">Type the 6-digit code from that email here</b> (the button in the email opens your web browser instead of this app).</p>' : '<b style="color:var(--text)">Tap the button</b> in that email — or type the 6-digit code here.</p>')) +
    '<input class="field code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" oninput="this.value=this.value.replace(/\\D/g,\'\');if(this.value.length===6)checkCode()">' +
    '<button class="btn p" id="codeBtn" onclick="checkCode()">Sign in</button>' +
    '<div class="err" id="err">' + esc(msg || '') + '</div>' +
    '<div class="fine"><a href="#" onclick="sendAgain();return false">Send it again</a> · <a href="#" onclick="viewSignin();return false">Use a different number</a><br>' +
    (S.channel === 'sms' ? '' : 'Don’t see it? Check your spam or promotions folder. ') + 'You’ll stay signed in on this device for 90 days.</div></div>';
  setTimeout(() => { const c = $('code'); if (c) c.focus(); }, 50);
}
async function sendAgain() { await api({ action: 'jr_phone_start', phone: S.phone }); toast('Sent again'); }
async function checkCode() {
  const code = ($('code') || {}).value || '', b = $('codeBtn');
  if (code.length < 4) return;
  b.disabled = true; b.textContent = 'Checking…';
  const r = await api({ action: 'jr_phone_verify', phone: S.phone, code: code });
  if (r.ok && r.token) { tokenSet(r.token); return loadMe(); }
  if (r.ok && r.pick) { S.ticket = r.ticket; return viewPick(r.pick); }
  b.disabled = false; b.textContent = 'Sign in'; $('err').textContent = r.error || 'Please try again.';
}
function viewPick(list) {
  noTabs();
  $('app').innerHTML = '<div class="signin"><img class="mark" src="/assets/ls-logo-white.png" alt="">' +
    '<h1 style="font-size:26px">Who’s signing in?</h1><p>A few people share this number. Pick your name.</p><div class="pick">' +
    list.map(p => '<button class="btn" onclick="pick(\'' + esc(p.pid) + '\')">' + esc(p.name) + '</button>').join('') + '</div><div class="err" id="err"></div></div>';
}
async function pick(pid) {
  const r = await api({ action: 'jr_pick', ticket: S.ticket, pid: pid });
  if (r.ok && r.token) { tokenSet(r.token); return loadMe(); }
  $('err').textContent = r.error || 'Please try again.';
}
async function pcoSignin() {
  const r = await api({ action: 'jr_oauth_start' });
  if (r.ok && r.url) location.href = r.url; else viewSignin(r.error);
}

// ── the journey ──────────────────────────────────────────────────────────────
async function loadMe() {
  noTabs();
  $('app').innerHTML = '<div class="loading">Getting everything ready…</div>';
  const slow = slowNote('#app', 'Getting everything ready… the first load can take a few extra seconds.');
  const body = S.preview ? { action: 'jr_me', preview: S.preview, pw: S.pw } : { action: 'jr_me', token: tokenGet() };
  const r = await api(body, 3);
  clearTimeout(slow);
  if (r.ok && r.person) { S.data = r; return viewJourney(); }   // only ever draw a real person's page
  if (r.signin) { tokenSet(''); return viewSignin(); }
  $('app').innerHTML = '<div class="loading">' + esc(r.error || 'We couldn’t load your page.') + '<br><br><button class="btn" onclick="loadMe()">Try again</button></div>';
}
const SEASONS = [
  ['exploring', 'Exploring', 'Finding your way to Jesus and this church'],
  ['belonging', 'Belonging', 'Baptized, a Family Member, Sunday is home'],
  ['growing', 'Growing', 'Growing with others in a group and on a team'],
  ['leading', 'Leading', 'Helping others take their next step'],
  ['sending', 'Sending', 'Living on mission in South Reno and beyond']
];
const SEASON_WORD = { exploring: 'an Exploring', belonging: 'a Belonging', growing: 'a Growing', leading: 'a Leading', sending: 'a Sending' };
const ICONS = {
  group: '<circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M14 15.5c3 0 7 1.5 7 4.5"/>',
  serve: '<path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/>',
  baptism: '<path d="M12 3c3 4 6 7.5 6 11a6 6 0 01-12 0c0-3.5 3-7 6-11z"/>',
  membership: '<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
  lead: '<path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.7 7.1 18.2 8 12.7 4 8.8 9.5 8z"/>',
  give: '<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7c-2-4-6-3-6-1s4 1 6 1c2 0 6 1 6-1s-4-3-6 1z"/>',
  invite: '<path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13"/>',
  celebrate: '<path d="M20 6L9 17l-5-5"/>'
};
function stepIcon(id) { const k = /group/.test(id) ? 'group' : /serve/.test(id) ? 'serve' : /baptism-on/.test(id) ? 'celebrate' : /baptism/.test(id) ? 'baptism' : /member/.test(id) ? 'membership' : /lead/.test(id) ? 'lead' : /give/.test(id) ? 'give' : 'invite'; return '<svg viewBox="0 0 24 24">' + ICONS[k] + '</svg>'; }
function dismissed() { try { return JSON.parse(localStorage.getItem(DISMISS_KEY) || '{}'); } catch (e) { return {}; } }
function dismiss(id) { const d = dismissed(); d[id] = Date.now() + 60 * 864e5; try { localStorage.setItem(DISMISS_KEY, JSON.stringify(d)); } catch (e) {} viewJourney(); toast('Okay — we’ll keep that for another season.'); }

// ── the app: Home · Events · Connect · Give · Me ────────────────────────────
// Everyone signs in (phone + texted code). Church Center still does the transactions (giving,
// registrations, sign-ups, check-in); every button here lands on the exact Church Center page.
const TAB_ICONS = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  events: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  connect: '<circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M14 15.5c3 0 7 1.5 7 4.5"/>',
  give: '<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7c-2-4-6-3-6-1s4 1 6 1c2 0 6 1 6-1s-4-3-6 1z"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'
};
const TABS = [['home', 'Home'], ['events', 'Events'], ['connect', 'Connect'], ['give', 'Give'], ['me', 'Me']];
const CC = 'https://lssr.churchcenter.com';
function ccLinks() { const L = (S.data && S.data.links) || {}; return {
  giving: L.giving || CC + '/giving', groups: L.groups || CC + '/groups', serve: L.serve || CC + '/groups/serve-teams',
  baptism: L.baptism || CC + '/people/forms/764941', membership: L.membership || '', me: L.churchCenter || CC + '/me',
  checkins: CC + '/check-ins', calendar: CC + '/calendar', registrations: CC + '/registrations/events' }; }
function curTab() { const h = (location.hash || '').replace(/^#/, '').split('/')[0]; return TABS.some(x => x[0] === h) ? h : 'home'; }
function go(tab) { const h = '#' + tab; if (location.hash !== h) history.pushState(null, '', location.pathname + location.search + h); viewJourney(); window.scrollTo(0, 0); }
window.addEventListener('popstate', () => { if (S.data) viewJourney(); });
function tabsHtml() { const cur = curTab(); return TABS.map(x => '<button class="' + (x[0] === cur ? 'on' : '') + '" onclick="go(\'' + x[0] + '\')"' + (x[0] === cur ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24">' + TAB_ICONS[x[0]] + '</svg><span>' + x[1] + '</span></button>').join(''); }
function noTabs() { $('ttabs').innerHTML = ''; $('tabbar').innerHTML = ''; document.body.classList.remove('app-in'); }
const ext = (href, label, cls) => '<a class="' + (cls || 'btn') + '" href="' + esc(href) + '" target="_blank" rel="noopener">' + label + '</a>';
const chev = '<svg class="chv" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
function linkRow(href, icon, title, sub, onclick) {
  return '<a class="lrow" ' + (onclick ? 'href="#" onclick="' + onclick + ';return false"' : 'href="' + esc(href) + '" target="_blank" rel="noopener"') + '><span class="li"><svg viewBox="0 0 24 24">' + icon + '</svg></span><span class="lt"><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</span>' + chev + '</a>';
}

function viewJourney() {
  const d = S.data, p = d.person || {}; tellParent();
  $('ttabs').innerHTML = tabsHtml(); $('tabbar').innerHTML = tabsHtml(); document.body.classList.add('app-in');
  $('topR').innerHTML = EMBED ? '' : '<a class="btn g sm wide-only" href="/">Dashboard</a>';
  const sName = (SEASONS.find(x => x[0] === d.season) || [, ''])[1];
  $('banner').innerHTML = S.preview ? '<div class="banner">Pastor preview of ' + esc(p.name) + '’s app · buttons that send or save are turned off' +
    (d.seasonWhy && d.seasonWhy.length ? '<div class="why"><b>Why ' + esc(sName) + ' (pastors only):</b> ' + d.seasonWhy.map(esc).join(' · ') + '</div>' : '') + '</div>' : '';
  const tab = curTab();
  const body = tab === 'events' ? viewEvents(d) : tab === 'connect' ? viewConnect(d) : tab === 'give' ? viewGive(d) : tab === 'me' ? viewMe(d) : viewHome(d);
  $('app').innerHTML = '<div class="wrap t-' + tab + '">' + (EMBED ? '<nav class="seg">' + tabsHtml() + '</nav>' : '') + body + '</div>';
  if (tab === 'home') { loadNews(d); loadSunday(); appCard(); }
  if (tab === 'events') loadEvents(d);
  if (tab === 'connect') loadFind();
  if (tab === 'me') { appCard(); const now_ = document.querySelector('.stop.now'); if (now_ && now_.parentElement.scrollWidth > now_.parentElement.clientWidth) now_.parentElement.scrollLeft = now_.offsetLeft - now_.parentElement.clientWidth / 2 + now_.offsetWidth / 2; }
  const sub = (location.hash || '').split('/')[1];      // e.g. /prayer → #me/prayer opens the prayer sheet once signed in
  if (sub === 'prayer' || sub === 'note') { history.replaceState(null, '', location.pathname + location.search + '#' + tab); setTimeout(() => openSheet(sub), 200); }
}

// ── Home: persistent encouragement, For you, This Sunday, coming up, news ─────────
function stepsHtml(d) {
  const dm = dismissed(), now = Date.now();
  const steps = (d.steps || []).filter(s => s.kind === 'celebrate' || !(dm[s.id] > now));
  return { steps, html: steps.length ? steps.map(s => '<div class="step' + (s.kind === 'celebrate' ? ' celebrate' : '') + '" data-sid="' + esc(s.id) + '"><div class="ic">' + stepIcon(s.id) + '</div><div><b>' + esc(s.title) + '</b><p>' + esc(s.why) + '</p>' +

        linkRow(L.checkins, '<path d="M4 7h16v13H4zM9 7V4h6v3"/>', 'Kids check-in', 'Check in from your phone') +
        linkRow(L.giving, TAB_ICONS.give, 'Giving history &amp; statements', '') +
        (L.membership ? linkRow(L.membership, '<path d="M3 11l9-7 9 7M5 10v10h14V10"/>', 'Becoming a Family Member', '') : '') +
      '</div></div>' +
      '<div class="card a-half"><div class="card-h"><h3>This app</h3></div><div id="jrApp"></div><div class="ll">' + theme +
        (S.preview ? '' : linkRow('', '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>', 'Sign out', 'You’ll need a new code to get back in', 'logout()')) + '</div></div>' +
    '</div>' +
    '<div class="quiet">This app is private — only you, and the pastors who care for you, can see your information. It’s built from what you’ve shared with Living Stones in Planning Center. See something that isn’t right? <a href="#" onclick="openSheet(\'note\',\'Something in my Living Stones app isn’t right: \');return false">Let us know</a> and we’ll fix it.</div>';
}

function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
// ── pathway badges: filled = a step you've taken, gray = one still ahead ──────────
const BADGES = [
  ['baptism', 'Baptism', 'baptism', 'Go public with your faith'],
  ['member', 'Family', 'membership', 'Make Living Stones home'],
  ['group', 'Group', 'group', 'Do life with others'],
  ['serve', 'Serve', 'serve', 'Use your gifts for others'],
  ['give', 'Give', 'give', 'Live generously'],
  ['lead', 'Lead', 'lead', 'Help someone take their next step']
];
function badgeDone(k, d) {
  const L = d.leading || {};
  return k === 'baptism' ? !!d.baptized : k === 'member' ? !!d.member : k === 'group' ? (d.groups || []).length > 0
    : k === 'serve' ? ((d.serving || {}).teams || []).length > 0 : k === 'give' ? !!(d.giving || {}).any
    : ((L.groups || []).length + (L.teams || []).length > 0) || (d.groups || []).some(x => x.leader);
}
function badgesHtml(d) {
  return '<div class="badges" aria-label="Your pathway">' + BADGES.map(b => { const on = badgeDone(b[0], d);
    return '<button class="badge' + (on ? ' on' : '') + '" title="' + esc(b[1] + (on ? ' ✓' : ' · ' + b[3])) + '" onclick="badgeTap(\'' + b[0] + '\',' + on + ')"><i><svg viewBox="0 0 24 24">' + ICONS[b[2]] + '</svg></i>' + b[1] + '</button>'; }).join('') + '</div>';
}
function badgeTap(k, on) {
  const b = BADGES.find(x => x[0] === k) || [];
  const el = !on && document.querySelector('.step[data-sid*="' + (k === 'member' ? 'member' : k) + '"]');
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); return; }
  toast(on ? b[1] + ' ✓ — thank you. That step matters.' : b[1] + ': ' + b[3] + '. Send your pastor a note anytime to talk about it.');
}
// ── "we see you" — recognize and encourage before we ask for anything ──────────
function seeYouHtml(d) {
  const out = [], sv = d.serving || {}, g = d.giving || {}, p = d.person || {};
  if (sv.servedThisYear) out.push('🙌 You’ve served ' + sv.servedThisYear + (sv.servedThisYear === 1 ? ' time' : ' times') + ' this year');
  if ((d.groups || []).some(x => x.leader)) out.push('⭐ Thank you for leading ' + esc((d.groups.find(x => x.leader) || {}).name || 'your group'));
  else if ((d.groups || []).length) out.push('🤝 Doing life with ' + esc(d.groups[0].name));
  if (g.any && (g.recurring || g.months >= 9)) out.push('💛 Your generosity is changing lives in South Reno');
  const yrs = p.since ? Math.floor((Date.now() - new Date(p.since)) / 3156e7) : 0;
  if (yrs >= 1) out.push('🏡 ' + yrs + (yrs === 1 ? ' year' : ' years') + ' at Living Stones');
  const now = new Date();
  (d.milestones || []).forEach(m => { if (!/baptiz/i.test(m.label || '') || !m.date) return; const b = new Date(String(m.date).length === 10 ? m.date + 'T12:00:00' : m.date);
    const ann = new Date(now.getFullYear(), b.getMonth(), b.getDate()); const days = Math.round((ann - now) / 864e5);
    if (days >= -14 && days <= 14 && now.getFullYear() > b.getFullYear()) { const n = now.getFullYear() - b.getFullYear(); out.unshift('💧 Happy baptism anniversary — ' + n + (n === 1 ? ' year!' : ' years!')); } });
  if (!out.length) out.push('👋 We’re so glad you’re part of Living Stones');
  return out.length ? '<div class="seeyou">' + out.slice(0, 3).map(s => '<span>' + s + '</span>').join('') + '</div>' : '';
}
// ── news & events — kept apart from "For you"; the same events, tagged for this person ──
let _newsP = null;
function newsTag(n, d) {
  const kids = d.kids || [];
  if (/baptism/i.test(n) && !d.baptized) return 'Your next step?';
  if (/fundamentals|membership|family member|newcomer|starting point/i.test(n) && !d.member) return 'Great for you';
  if (/student/i.test(n) && kids.some(k => k.age >= 11 && k.age <= 18)) return 'For your teen';
  if (/stepping stones|kids/i.test(n) && kids.some(k => k.age != null && k.age < 11)) return 'For your kids';
  if (/bible study|study|group/i.test(n) && !(d.groups || []).length) return 'A great way to connect';
  return '';
}
function loadNews(d) {
  const el = document.getElementById('jrNews'); if (!el) return;
  (_newsP = _newsP || fetch('/eos-data.json?v=' + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null)).then(j => {
    const box = document.getElementById('jrNews'); if (!box) return;
    const evs = ((j && j.calendar && j.calendar.events) || []);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const until = new Date(today.getTime() + 60 * 864e5), key = x => new Date(x + 'T12:00:00');
    const teen = (d.kids || []).some(k => k.age >= 11 && k.age <= 18), seen = {}, list = [];
    evs.filter(e => e.visibleCC && !e.rbd && key(e.dateKey) >= today && key(e.dateKey) <= until && !/sunday gathering/i.test(e.name || ''))
      .filter(e => teen || !/student|youth/i.test(e.name || ''))
      .sort((a, b) => a.dateKey < b.dateKey ? -1 : a.dateKey > b.dateKey ? 1 : 0)
      .forEach(e => { const nk = String(e.name).trim().toLowerCase(); if (seen[nk]) { seen[nk].repeats++; return; } const it = { e, repeats: 0, tag: newsTag(e.name || '', d) }; seen[nk] = it; list.push(it); });
    // up to 2 picked-for-you per kind, then the rest of the calendar by date (6 total)
    const perTag = {}, picked = list.filter(it => it.tag && (perTag[it.tag] = (perTag[it.tag] || 0) + 1) <= 2).slice(0, 2);
    const show = picked.concat(list.filter(it => picked.indexOf(it) < 0 && !it.tag).slice(0, Math.max(0, 4 - picked.length))).slice(0, 4)
      .sort((a, b) => (b.tag ? 1 : 0) - (a.tag ? 1 : 0) || (a.e.dateKey < b.e.dateKey ? -1 : 1));
    box.className = show.length ? 'news' : 'dim';
    box.innerHTML = show.length ? show.map(it => { const e = it.e, img = e.img || (e.imgLocal ? '/' + e.imgLocal : '');
      return '<a class="nv" href="' + esc(e.url || 'https://lssr.churchcenter.com/calendar') + '" target="_blank" rel="noopener">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : '') +
        '<div>' + (it.tag ? '<em>' + esc(it.tag) + '</em>' : '') + '<b>' + esc(String(e.name).trim()) + '</b><small>' + fmtDate(e.dateKey + 'T12:00:00', { weekday: 'short', month: 'short', day: 'numeric' }) + (e.time && !/^12:00 AM$/.test(e.time) ? ' · ' + esc(e.time) : '') + (it.repeats ? ' · and ' + (it.repeats >= 3 ? 'weekly' : 'more dates') : '') + '</small></div></a>'; }).join('')
      : j ? 'Nothing on the church calendar in the next couple of months.'
          : 'Couldn’t load events just now — see the <a href="https://lssr.churchcenter.com/calendar" target="_blank" rel="noopener">church calendar</a>.';
    tellParent();
  });
}

// ── leaders: your group / your team ──────────────────────────────────────────
function leadHtml(L) {
  if (!L || (!(L.groups || []).length && !(L.teams || []).length)) return '';
  const yn = v => v === true ? '<span class="y">Yes</span>' : v === false ? '<span class="nn">Not yet</span>' : '<span class="q">—</span>';
  const block = (t, kind) => {
    const other = kind === 'group' ? 'Serving' : 'In a group';
    const m = t.members || [];
    const fam = m.filter(x => x.familyMember).length, oth = m.filter(x => kind === 'group' ? x.serving : x.inGroup).length;
    const rows = m.map(x => '<tr><td class="n">' + esc(x.name) + (x.leader ? '<small>Co-leader</small>' : '') + '</td>' +
      '<td class="f" data-l="Family Member">' + (x.inProcess ? '<span class="q">In process</span>' : yn(x.familyMember)) + '</td>' +
      '<td class="o" data-l="' + other + '">' + yn(kind === 'group' ? x.serving : x.inGroup) + '</td>' +
      '<td class="o" data-l="Baptized">' + yn(x.baptized) + '</td>' +
      '<td class="s">' + esc(x.step) + '</td></tr>').join('');
    return '<div class="card" style="margin-top:16px"><div class="card-h"><h3>' + (kind === 'group' ? 'Your group' : 'Your team') + ' · ' + esc(t.name) + '</h3><span class="c">' + m.length + (m.length === 1 ? ' person' : ' people') + '</span></div>' +
      '<div class="lead-sum"><span><b>' + fam + '</b> of ' + m.length + ' are Family Members</span><span><b>' + oth + '</b> of ' + m.length + ' ' + (kind === 'group' ? 'are serving' : 'are in a group') + '</span><span><b>' + m.filter(x => x.baptized).length + '</b> of ' + m.length + ' are baptized</span></div>' +
      (m.length ? '<table class="roster"><thead><tr><th>Name</th><th>Family Member</th><th>' + other + '</th><th>Baptized</th><th>A next step you could encourage</th></tr></thead><tbody>' + rows + '</tbody></table>'
                : '<div class="dim">Nobody on the roster yet.</div>') +
      '<div class="quiet" style="margin:12px 0 0;font-size:12px">Shown to you because you lead this ' + kind + '. Names and simple yes/no only — never giving or pastoral notes. Suggestions are a starting point, not a grade.</div></div>';
  };
  return (L.groups || []).map(g => block(g, 'group')).join('') + (L.teams || []).map(t => block(t, 'team')).join('');
}

// ── note / prayer ────────────────────────────────────────────────────────────
function openSheet(kind, prefill) {
  const pn = S.data && S.data.pastor && S.data.pastor.name ? S.data.pastor.name.split(' ')[0] : 'your pastor';
  $('sheet').innerHTML = '<h3>' + (kind === 'prayer' ? 'Share a prayer request' : 'Send ' + esc(pn) + ' a note') + '</h3>' +
    '<div class="dim">' + (kind === 'prayer' ? 'This goes to our prayer team, and ' + esc(pn) + ' is told too. It’s kept private.' : 'It goes straight to ' + esc(pn) + '.') + '</div>' +
    '<textarea id="noteTxt" placeholder="' + (kind === 'prayer' ? 'How can we pray for you?' : 'Write a few words…') + '">' + esc(prefill || '') + '</textarea>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn g" onclick="closeSheet()">Cancel</button>' +
    '<button class="btn p" id="noteBtn" onclick="sendNote(\'' + kind + '\')"' + (S.preview ? ' disabled title="Turned off in preview"' : '') + '>Send</button></div>';
  $('sheetOv').classList.add('open');
  setTimeout(() => { const t = $('noteTxt'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 50);
}
function closeSheet() { $('sheetOv').classList.remove('open'); }
async function sendNote(kind) {
  if (S.preview) return;
  const text = ($('noteTxt') || {}).value || '', b = $('noteBtn');
  if (!text.trim()) return;
  b.disabled = true; b.textContent = 'Sending…';
  const r = await api({ action: 'jr_note', token: tokenGet(), kind: kind, text: text }, 1);
  if (r.ok) { closeSheet(); toast(kind === 'prayer' ? 'Thank you — we’re praying with you.' : 'Sent. Thank you!'); }
  else { b.disabled = false; b.textContent = 'Send'; toast(r.error || 'That didn’t send — please try again.'); }
}
async function logout() { await api({ action: 'jr_logout', token: tokenGet() }, 1); tokenSet(''); S.data = null; viewSignin(); tellParent(); }
// Signed-in state for the dashboard (so it can label the tab).
// ── the member app: "Add to Home Screen" (manifest: /journey/manifest.webmanifest, service worker: /sw.js) ──
// Android/Chrome hands us an install prompt; iPhone needs Share → Add to Home Screen. Installed apps on
// iPhone keep their own storage, so people sign in once more inside the app (the 90-day token then lives there).
let _appPrompt = null;
const APP_SNOOZE = 'lssr_app_snooze';
function appStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function appIsIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function appIsPhone() { return /iphone|ipad|ipod|android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 820); }
function appCard() {
  const el = $('jrApp'); if (!el) return;
  let snoozed = false; try { snoozed = Number(localStorage.getItem(APP_SNOOZE) || 0) > Date.now(); } catch (e) {}
  if (EMBED || S.preview || appStandalone() || snoozed || !appIsPhone() || !(_appPrompt || appIsIOS())) { el.innerHTML = ''; return; }
  const share = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
  el.innerHTML = '<div class="getapp"><img src="/assets/app/icon-192.png" alt=""><div><b>Get the Living Stones app</b>' +
    (_appPrompt ? '<p>One tap puts this page on your home screen — it opens full-screen, and you stay signed in.</p>' +
                  '<div class="acts"><button class="btn p sm" onclick="appInstall()">Add to Home Screen</button><button class="btn g sm" onclick="appSnooze()">Not now</button></div>'
                : '<p>Tap ' + share + ' <b style="display:inline;font-size:inherit">Share</b> at the bottom of Safari, then <b style="display:inline;font-size:inherit">Add to Home Screen</b>. Open it from your home screen and sign in once more — then you’re set.</p>' +
                  '<div class="acts"><button class="btn g sm" onclick="appSnooze()">Not now</button></div>') +
    '</div></div>';
}
async function appInstall() {
  const p = _appPrompt; _appPrompt = null; if (!p) return appCard();
  try { p.prompt(); const c = await p.userChoice; if (c && c.outcome === 'dismissed') appSnooze(7); else appCard(); } catch (e) { appCard(); }
}
function appSnooze(days) { try { localStorage.setItem(APP_SNOOZE, String(Date.now() + (days || 30) * 864e5)); } catch (e) {} appCard(); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _appPrompt = e; appCard(); });
window.addEventListener('appinstalled', () => { _appPrompt = null; appCard(); toast('Added — find Living Stones on your home screen.'); });

function tellParent() { if (EMBED) { try { parent.postMessage({ jrSignedIn: !!tokenGet(), jrFirst: (S.data && S.data.person && String(S.data.person.first).split(' ')[0]) || '' }, location.origin); } catch (e) {} } }

// ── start ────────────────────────────────────────────────────────────────────
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (appStandalone()) document.documentElement.classList.add('standalone');
if (!EMBED && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('/sw.js').catch(() => {});
// The dashboard's Sign out ends this session too.
window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.jrLogout) { tokenSet(''); S.data = null; viewSignin(); tellParent(); } });
if (EMBED) {
  document.body.classList.add('embed');
  // Tell the dashboard how tall we are so its iframe never scrolls on its own.
  const post = () => { try { parent.postMessage({ jrHeight: document.documentElement.scrollHeight }, location.origin); } catch (e) {} };
  new ResizeObserver(post).observe(document.body); setInterval(post, 1500); window.addEventListener('load', post);
}
(async function start() {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (q.get('preview') && h.get('k')) {                     // pastor preview (from the Shepherding drawer)
    S.preview = q.get('preview').replace(/\D/g, ''); S.pw = h.get('k');
    history.replaceState(null, '', location.pathname + '?preview=' + S.preview);   // drop the key from the address bar
    return loadMe();
  }
  if (q.get('m')) {                                         // one-tap link from the sign-in email
    $('app').innerHTML = '<div class="loading">Signing you in…</div>';
    const r = await api({ action: 'jr_magic', m: q.get('m') }, 1);
    history.replaceState(null, '', location.pathname);
    if (r.ok && r.token) { tokenSet(r.token); return loadMe(); }
    S.cfg = (await api({ action: 'jr_config' })) || {}; return viewSignin(r.error);
  }
  if (q.get('code') && q.get('state')) {                    // back from "Sign in with Planning Center"
    $('app').innerHTML = '<div class="loading">Finishing sign-in…</div>';
    const r = await api({ action: 'jr_oauth_finish', code: q.get('code'), state: q.get('state') }, 1);
    history.replaceState(null, '', location.pathname);
    if (r.ok && r.token) { tokenSet(r.token); return loadMe(); }
    S.cfg = (await api({ action: 'jr_config' })) || {}; return viewSignin(r.error);
  }
  if (tokenGet()) return loadMe();
  const slow = slowNote('#app', 'Loading… one moment.');
  const cfg = await api({ action: 'jr_config' });
  clearTimeout(slow);
  S.cfg = cfg && cfg.ok ? cfg : { channel: 'email' };
  viewSignin();
})();
</script>
</body>
</html>
